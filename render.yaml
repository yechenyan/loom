services:
  - type: web
    name: loom-api-free
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install ./packages/loom-server
    startCommand: loom-server run --storage-root /var/data/loom-server-storage --workspace-root /opt/render/project/src
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LOOM_SERVER_DATABASE_URL
        fromDatabase:
          name: loom-postgres
          property: connectionString
      - key: LOOM_SERVER_CORS_ORIGINS
        value: "*"
    disk:
      name: loom-server-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: loom-web
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: ./web/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://loom-api-free.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: loom-postgres
    plan: free
