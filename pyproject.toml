[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
loom = "loom.cli:main"

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/loom-server"]

[tool.setuptools]
package-dir = {"" = "packages/loom/src"}

[tool.setuptools.packages.find]
where = ["packages/loom/src"]

[dependency-groups]
dev = []
