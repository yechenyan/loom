[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loom"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0,<1.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "uvicorn>=0.47.0,<1.0.0",
]

[project.scripts]
loom = "loom.cli:main"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "packages/loom/src"}

[tool.setuptools.packages.find]
where = ["packages/loom/src"]

[dependency-groups]
dev = []
