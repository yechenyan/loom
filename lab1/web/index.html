<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>德国电网瓶颈模型</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="header">
        <div>
          <p class="eyebrow">Germany transmission bottleneck screening</p>
          <h1>德国当前电网瓶颈</h1>
          <p class="subhead" id="timestamp"></p>
        </div>
        <div class="badge" id="method"></div>
      </section>

      <section class="kpis" aria-label="model indicators">
        <div><span id="load">-</span><small>负荷 MW</small></div>
        <div><span id="generation">-</span><small>发电 MW</small></div>
        <div><span id="overloads">-</span><small>过载线路</small></div>
        <div><span id="watch">-</span><small>80%+ 线路</small></div>
      </section>

      <section class="workspace">
        <div class="map-panel">
          <div class="panel-title">
            <h2>瓶颈地图</h2>
            <span>颜色表示利用率</span>
          </div>
          <svg id="grid-map" role="img" aria-label="Germany bottleneck map"></svg>
          <div class="legend">
            <span><i class="normal"></i>正常</span>
            <span><i class="watch"></i>关注</span>
            <span><i class="tight"></i>紧张</span>
            <span><i class="overload"></i>过载</span>
          </div>
        </div>

        <aside class="rank-panel">
          <div class="panel-title">
            <h2>Top 瓶颈</h2>
            <span>按模型评分排序</span>
          </div>
          <div id="line-list" class="line-list"></div>
        </aside>
      </section>

      <section class="notes">
        <h2>数据与模型边界</h2>
        <p>
          该页面使用公开拓扑、Energy-Charts 最新有效发电/负荷，以及 SMARD
          控制区数据校验。由于德国实时完整网架、开关状态、N-1 remedial action
          和 redispatch 细节不完全公开，结果是开源筛查模型，不是官方调度结论。
        </p>
      </section>
    </main>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
